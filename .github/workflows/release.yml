name: Release

# Pushing a tag like v1.2.3 builds the bundle, runs the tests and publishes a GitHub release
# with dist/ha-glowstat.js attached. The release notes are the matching CHANGELOG.md section.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build, and check that the committed bundle is up to date
        run: |
          ./build.sh
          git diff --exit-code dist/ha-glowstat.js
      - run: npm test
      - name: Check that the tag matches the package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Extract the release notes from the changelog
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" { f = 1; next } /^## \[/ { f = 0 } f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG.md section for ${GITHUB_REF_NAME#v}" >&2; exit 1; }
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/ha-glowstat.js --title "$GITHUB_REF_NAME" --notes-file notes.md
